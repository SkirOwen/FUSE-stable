[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fuse202"
version = "2.02"
authors = [
    { name = "Chris Collins", email = "c.m.collins@liverpool.ac.uk" },
]
description = "Flexible Unit Structure Engine crystal structure prediction code"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "ase>=3.23",
    "numpy",
    "pandas",
    "spglib",
    "func-timeout",
    "matplotlib",
]

[project.optional-dependencies]
ml = [
    "chgnet",
    "torch",
    "pymatgen",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fuse202*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
